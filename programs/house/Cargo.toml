[package]
name = "house"
version = "0.1.0"
description = "ACME house: the treasury split, the prize vault and the upgrade shop"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "house"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
# anchor-spl and arena MUST be listed too, or `anchor build` cannot generate the IDL.
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "arena/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# Exact pins: must match the anchor CLI (avm) and @anchor-lang/core in package.json.
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.1.2", default-features = false, features = ["token", "token_2022", "associated_token"] }
# fund_cup: a CPI into arena's create_cup, signed by the prize vault.
arena = { path = "../arena", features = ["cpi"] }

# In-process SVM for fast tests (`cargo test`); no validator.
[dev-dependencies]
litesvm = "0.10.0"
litesvm-token = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3.2.0"
solana-sdk-ids = "3.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
