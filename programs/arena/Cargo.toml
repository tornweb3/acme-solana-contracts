[package]
name = "arena"
version = "0.2.0"
description = "ACME arena: escrow for live-race rooms and prize cups"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "arena"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
# anchor-spl MUST be listed too, or `anchor build` cannot generate the IDL.
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# Exact pins: must match the anchor CLI (avm) and @anchor-lang/core in package.json.
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.1.2", default-features = false, features = ["token", "token_2022", "token_2022_extensions", "associated_token"] }
# Not re-exported through Anchor 1.x's solana_program shim. Same versions
# anchor-lang already pulls in.
solana-sdk-ids = "3.1"       # sysvar::slot_hashes::ID
solana-sha256-hasher = "3.1" # hashv: result digest, seeds, merkle leaves

# In-process SVM for fast tests (`cargo test`); no validator.
[dev-dependencies]
litesvm = "0.10.0"
litesvm-token = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3.2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
