# Pinned so every build (and a later `solana-verify` reproducible build) uses the
# same toolchain. Match these to what is installed: `anchor --version`,
# `solana --version`.
[toolchain]
package_manager = "npm"
anchor_version = "1.1.2"
solana_version = "3.1.10"

[features]
resolution = true
skip-lint = false

# Program keypairs: ~/.config/solana/acme/{arena,house}.json, shared by
# localnet and devnet (garage.json stays there: retired, keys are never deleted).
# MAINNET MUST GET NEW KEYPAIRS.
[programs.localnet]
arena = "G8hRPxkadXhZcuyeH7vWCqmfAqfWNAuxJnBftPezcUdK"
house = "5rV9yXr14uvsxJZnNqQRRwX7ZZ3FWNqZcGyrz3B4YXgw"

[programs.devnet]
arena = "G8hRPxkadXhZcuyeH7vWCqmfAqfWNAuxJnBftPezcUdK"
house = "5rV9yXr14uvsxJZnNqQRRwX7ZZ3FWNqZcGyrz3B4YXgw"

# `anchor test` ALWAYS runs against a throwaway local validator. Devnet is only
# ever reached through commands given an explicit --url / --provider.cluster.
[provider]
cluster = "localnet"
wallet = "~/.config/solana/acme/deployer.json"

[scripts]
test = "node --test \"client/test/*.test.mjs\""

# The validator takes longer than Anchor's default to boot under WSL.
[test]
startup_wait = 60000

# Our programs again, as UPGRADEABLE with the provider wallet as upgrade
# authority. Anchor's default load gives them no authority, and both programs'
# `initialize` only accepts the upgrade authority, exactly as on a real cluster.
[[test.genesis]]
address = "G8hRPxkadXhZcuyeH7vWCqmfAqfWNAuxJnBftPezcUdK"
program = "target/deploy/arena.so"
upgradeable = true

[[test.genesis]]
address = "5rV9yXr14uvsxJZnNqQRRwX7ZZ3FWNqZcGyrz3B4YXgw"
program = "target/deploy/house.so"
upgradeable = true
